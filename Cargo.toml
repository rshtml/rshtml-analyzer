[package]
name = "rshtml-analyzer"
version = "0.1.7"
edition = "2024"

[dependencies]
tower-lsp = { version = "0.20.0" }
tokio = { version = "1.53.3", features = ["full"] }
tree-sitter = "0.27.1"
tree-sitter-highlight = "0.27.1"
# tree-sitter-rshtml = { path = "../tree-sitter-rshtml" }
tree-sitter-rshtml = { git = "https://github.com/rshtml/tree-sitter-rshtml.git", tag = "v0.1.7" }
tree-sitter-html = "0.23.2"
tree-sitter-rust = "0.24.2"
tracing = { version = "0.1.44", features = ["release_max_level_info"] }
tracing-subscriber = "0.3.23"
toml = "1.1.8"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
